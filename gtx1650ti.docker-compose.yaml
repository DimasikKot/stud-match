# gtx1650ti

services:
  sm-llm-worker:
    container_name: sm-llm-worker
    build:
      context: ./llm-worker # Папка, содержащая файлы контейнера
      dockerfile: gtx1650ti.llm-worker.Dockerfile
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8070/health'', timeout=5)" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    ports:
      - "127.0.0.1:8070:8070"

    environment:
      - HF_TOKEN=${HF_TOKEN}
      - KAFKA_HOST=${LLM_KF_HOST}
      - KAFKA_PORT=${LLM_KF_PORT}
      - KAFKA_USERNAME=${LLM_KF_USERNAME}
      - KAFKA_PASSWORD=${LLM_KF_PASSWORD}

    volumes:
      - ./llm-worker:/app
      - sm_hf_cache:/root/.cache/huggingface # Кэш моделей HF

    networks:
      - nginx-network # Доступ к sm-redis и sm-backend

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  nginx-network:
    external: true

volumes:
  sm_hf_cache:
