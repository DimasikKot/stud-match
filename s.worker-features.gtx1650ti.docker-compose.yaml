# gtx1650ti

services:
  sm-worker-features:
    container_name: sm-worker-features
    build:
      context: ./worker-features # Папка, содержащая файлы контейнера
      dockerfile: worker-features.gtx1650ti.Dockerfile
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8070/health'', timeout=5)" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    ports:
      - "127.0.0.1:8070:8070"

    environment:
      - HF_TOKEN=${W_FTRS_HF_TOKEN}
      - KAFKA_HOST=${KF_W_FTRS_HOST}
      - KAFKA_PORT=${KF_W_FTRS_PORT}
      - KAFKA_USERNAME=${KF_W_FTRS_USERNAME}
      - KAFKA_PASSWORD=${KF_W_FTRS_PASSWORD}
      - KAFKA_TASKS_TOPIC=${KF_W_FTRS_TASKS_TOPIC}
      - KAFKA_RESULTS_TOPIC=${KF_W_FTRS_RESULTS_TOPIC}
      - KAFKA_CONSUMER_GROUP=${KF_W_FTRS_CONSUMER_GROUP}

    volumes:
      - ./worker-features:/app
      - sm_hf_cache:/root/.cache/huggingface # Кэш моделей HF

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  nginx-network:
    external: true

volumes:
  sm_hf_cache:
