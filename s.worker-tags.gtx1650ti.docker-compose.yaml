# gtx1650ti

services:
  sm-worker-tags:
    container_name: sm-worker-tags
    build:
      context: ./worker-tags # Папка, содержащая файлы контейнера
      dockerfile: worker-tags.gtx1650ti.Dockerfile
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8070/health'', timeout=5)" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    ports:
      - "127.0.0.1:8070:8070"

    environment:
      - HF_TOKEN=${W_TAGS_HF_TOKEN}
      - KAFKA_HOST=${KF_W_TAGS_HOST}
      - KAFKA_PORT=${KF_W_TAGS_PORT}
      - KAFKA_USERNAME=${KF_W_TAGS_USERNAME}
      - KAFKA_PASSWORD=${KF_W_TAGS_PASSWORD}
      - KAFKA_TASKS_TOPIC=${KF_W_TAGS_TASKS_TOPIC}
      - KAFKA_RESULTS_TOPIC=${KF_W_TAGS_RESULTS_TOPIC}
      - KAFKA_CONSUMER_GROUP=${KF_W_TAGS_CONSUMER_GROUP}

    volumes:
      - ./worker-tags:/app
      - sm_hf_cache:/root/.cache/huggingface # Кэш моделей HF

    networks:
      - nginx-network # Доступ к sm-redis и sm-backend

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  nginx-network:
    external: true

volumes:
  sm_hf_cache:
