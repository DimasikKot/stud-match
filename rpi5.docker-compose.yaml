# pri5(arm64)

services:
  sm-frontend:
    container_name: sm-frontend
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5100/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - CHOKIDAR_USEPOLLING=true # Нужен для hot-reload

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-backend:
    container_name: sm-backend
    build:
      context: ./backend # Папка, содержащая файлы контейнера
      dockerfile: backend.Dockerfile
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8060/backend/api/v1/healths/backend'', timeout=5)" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./backend:/app

    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${R_PASSWORD:?R_PASSWORD variable is not set}
      # DB
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD variable is not set}
      # JWT
      - USER_JWT_ACCESS_TOKEN_SECRET=${USER_JWT_ACCESS_TOKEN_SECRET:?USER_JWT_ACCESS_TOKEN_SECRET is not set}
      - USER_JWT_ACCESS_TOKEN_EXPIRATION_HOURS=${USER_JWT_ACCESS_TOKEN_EXPIRATION_HOURS}
      - USER_JWT_REFRESH_TOKEN_SECRET=${USER_JWT_REFRESH_TOKEN_SECRET:?USER_JWT_REFRESH_TOKEN_SECRET is not set}
      - USER_JWT_REFRESH_TOKEN_EXPIRATION_HOURS=${USER_JWT_REFRESH_TOKEN_EXPIRATION_HOURS}
      - TRAIN_JWT_ACCESS_TOKENS=${TRAIN_JWT_ACCESS_TOKENS}
      - STORAGE_PATH=${STORAGE_PATH}

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  sm-postgres:
    container_name: sm-postgres
    image: postgres:18 # фиксированная версия для стабильности
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm-admin -d sm-db"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./postgres/data:/var/lib/postgresql # Сохраняем данные
      - ./postgres/init:/docker-entrypoint-initdb.d # Папка со скриптами инициализации
      - ./postgres/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./postgres/ssl/server.key:/var/lib/postgresql/server.key:ro
      - ./postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro # Настройки доступа

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD variable is not set}
    command: >
      sh -c "
      cp /var/lib/postgresql/server.crt /tmp/server.crt &&
      cp /var/lib/postgresql/server.key /tmp/server.key &&
      cp /var/lib/postgresql/pg_hba.conf /tmp/pg_hba.conf &&
      chown 999:999 /tmp/server.crt /tmp/server.key /tmp/pg_hba.conf &&
      chmod 600 /tmp/server.key &&
      chmod 644 /tmp/pg_hba.conf &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/tmp/server.crt
      -c ssl_key_file=/tmp/server.key
      -c hba_file=/tmp/pg_hba.conf
      "

    ports:
      - "4500:5432"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  sm-redis:
    container_name: sm-redis
    image: redis:8
    restart: always

    volumes:
      - ./redis/data:/var/lib/redis/data

    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}
    command:
      - /bin/sh
      - -c
      # - Double dollars, so that the variable is not expanded by Docker Compose
      # - Surround by quotes, so that the shell does not split the password
      # - The ${variable:?message} syntax causes shell to exit with a non-zero
      #   code and print a message, when the variable is not set or empty
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:443/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/rpi5.nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot # Добавляем для верификации

    ports:
      - "80:80" # перенаправляем 80 порт на 443 + подтверждение домена
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-certbot:
    container_name: sm-certbot
    image: certbot/certbot
    restart: unless-stopped

    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot

    entrypoint: /bin/sh -c "
      certbot certonly --webroot -w /var/www/certbot \
      --email kozhuharew.dima@gmail.com \
      -d fundata.mooo.com \
      -d stud-match.mooo.com \
      --non-interactive --agree-tos \
      --keep-until-expiring;
      while true; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h;
      done"

    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - nginx

networks:
  nginx-network:
    external: true # Указываем что не локальная в docker-compose, а общая для всего докера
