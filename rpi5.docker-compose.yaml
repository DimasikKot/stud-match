# pri5(arm64)

services:
  frontend:
    container_name: sm-frontend
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    restart: always

    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file:
      - ./frontend/.env.local
    environment:
      - CHOKIDAR_USEPOLLING=true # Нужен для hot-reload

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  backend:
    container_name: sm-backend
    build:
      context: ./backend # Папка, содержащая файлы контейнера
      dockerfile: backend.Dockerfile
    restart: always

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env.local

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  postgres:
    container_name: sm-postgres
    image: postgres:18 # фиксированная версия для стабильности
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_admin -d stud-match"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./postgres:/var/lib/postgresql # сохраняем данные

    environment:
      POSTGRES_USER: sm_admin # опционально, по умолчанию postgres
      POSTGRES_PASSWORD: password_superPuper
      POSTGRES_DB: stud-match # опционально, база по умолчанию

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  redis:
    container_name: sm-redis
    image: redis:8
    restart: always

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  nginx:
    container_name: sm-nginx
    image: nginx:alpine
    restart: unless-stopped

    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot # Добавляем для верификации

    ports:
      - "443:443"

    networks:
      - nginx-network

