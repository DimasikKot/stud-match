# pri5(arm64)

services:
  sm-backend:
    container_name: backend
    build:
      context: ./backend # Папка, содержащая файлы контейнера
      dockerfile: backend.Dockerfile
    restart: always

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env.local

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  sm-frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    restart: always

    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file:
      - ./frontend/.env.local
    environment:
      - CHOKIDAR_USEPOLLING=true # Нужен для hot-reload

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-postgres:
    container_name: postgres
    image: postgres:16 # фиксированная версия для стабильности
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./postgres_data:/var/lib/postgresql/data # сохраняем данные

    environment:
      POSTGRES_USER: postgres # опционально, по умолчанию postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres # опционально, база по умолчанию

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-redis:
    container_name: redis
    image: redis:7
    restart: always

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true # Указываем что не локальная в docker-compose, а общая для всего докера
