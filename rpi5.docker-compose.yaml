  backend:
    container_name: sm-backend
    build:
      context: ./backend # Папка, содержащая файлы контейнера
      dockerfile: backend.Dockerfile
    restart: always

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env.local

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  postgres:
    container_name: sm-postgres
    image: postgres:18 # фиксированная версия для стабильности
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_admin -d stud-match"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./postgres:/var/lib/postgresql # сохраняем данные

    environment:
      POSTGRES_USER: sm_admin # опционально, по умолчанию postgres
      POSTGRES_PASSWORD: password_superPuper
      POSTGRES_DB: stud-match # опционально, база по умолчанию

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  redis:
    container_name: sm-redis
    image: redis:8
    restart: always

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true # Указываем что не локальная в docker-compose, а общая для всего докера
