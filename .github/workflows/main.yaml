name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # --- Задание для Frontend ---
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend

  # --- Задание для Backend ---
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./backend

      - name: Run backend tests
        run: pytest -v
        working-directory: ./backend

  # --- Деплой ---
  deploy:
    needs: [test-frontend, test-backend] # Эта задача запустится ТОЛЬКО если test прошёл успешно
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Дополнительная проверка на ветку

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            # Перейдите в директорию с вашим docker-compose файлом на сервере
            cd ${{ secrets.PROJECT_PATH }}

            # Обновите код из репозитория
            git pull origin main

            # Пересоберите и перезапустите сервисы
            # Флаг --build важен, если Dockerfile'ы изменились
            docker compose -f localhost.docker-compose.yaml up -d --build

            # (Опционально) Очистите старые образы
            docker image prune -f
