name: CI/CD Pipeline

on:
  push:
    branches:
      - "main"

# ---- Очередь деплоев: запуски не отменяют друг друга, а ждут ----
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_pull: ${{ steps.filter.outputs.frontend_pull }}
      backend_pull: ${{ steps.filter.outputs.backend_pull }}
      frontend_build: ${{ steps.filter.outputs.frontend_build }}
      backend_build: ${{ steps.filter.outputs.backend_build }}
      nginx_build: ${{ steps.filter.outputs.nginx_build }}
      postgres_build: ${{ steps.filter.outputs.postgres_build }}
      postgres_reinit: ${{ steps.filter.outputs.postgres_reinit }}
      all_build: ${{ steps.filter.outputs.all_build }}
      prev_sha: ${{ steps.prev.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get last successfully deployed SHA
        id: prev
        run: |
          git fetch --tags --force
          SHA=$(git rev-list -n1 deployed/last-success 2>/dev/null || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Base for diff: ${SHA:-<none, first deploy>}"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.prev.outputs.sha || github.event.before }}
          filters: |
            frontend_pull:
              - 'frontend/**'
            backend_pull:
              - 'backend/**'
            frontend_build:
              - 'frontend/frontend.Dockerfile'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.app.json'
              - 'frontend/tsconfig.node.json'
              - 'frontend/vite.config.ts'
            backend_build:
              - 'backend/backend.Dockerfile'
              - 'backend/requirements.txt'
            nginx_build:
              - 'nginx/rpi5.nginx.conf'
            postgres_build:
              - 'postgres/pg_hba.conf'
            postgres_reinit:
              - 'postgres/init/**'
            all_build:
              - '.github/workflows/build.yaml'
              - '.env.example'
              - 'rpi5.docker-compose.yaml'

  lint-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_pull == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Run Prettier check
        run: npm run lint:check
        working-directory: ./frontend

  lint-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_pull == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt
        working-directory: ./backend
      - name: Run Black check
        run: black --check .
        working-directory: .

  test-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_pull == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend

  test-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_pull == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./backend

      - name: Run backend tests
        run: python -m pytest -v
        working-directory: ./backend

  build_deploy:
    needs: [detect-changes, test-frontend, test-backend]
    runs-on: ubuntu-latest
    # (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
    # (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
    if: |
      always() &&
      !cancelled()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: FRONTEND_BUILD,BACKEND_BUILD,NGINX_BUILD,POSTGRES_BUILD,POSTGRES_REINIT,ALL_BUILD,PREV_SHA
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main

            COMPOSE="docker compose -f rpi5.docker-compose.yaml"

            # ---------- Postgres: точечный реинит init-скриптов ----------
            # Запускаем все *.sql начиная с первого изменённого — drop+create внутри файлов идемпотентны
            if [ "$POSTGRES_REINIT" = "true" ]; then
              # Бэкап data -> data_old (только на остановленном postgres, иначе копия может быть битой)
              $COMPOSE stop sm-postgres
              if [ -d ./postgres/data ]; then
                if [ -d ./postgres/data_old ]; then
                  echo "::warning::./postgres/data_old already exists, overwriting"
                  sudo rm -rf ./postgres/data_old
                fi
                sudo cp -a ./postgres/data ./postgres/data_old
                echo "Backup created: ./postgres/data_old"
              else
                echo "No ./postgres/data to backup (fresh install?)"
              fi
              $COMPOSE up -d sm-postgres

              # Ждём готовности postgres
              for i in $(seq 1 30); do
                docker exec sm-postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 && break
                [ "$i" = "30" ] && { echo "::error::postgres not ready"; exit 1; }
                sleep 2
              done

              FIRST=""
              if [ -n "$PREV_SHA" ]; then
                FIRST=$(git diff --name-only --diff-filter=AM "$PREV_SHA"..HEAD -- 'postgres/init/*.sql' \
                        | while read -r f; do [ -f "$f" ] && echo "$f"; done \
                        | LC_ALL=C sort | head -1)
              fi
              [ -z "$FIRST" ] && FIRST=$(ls postgres/init/*.sql | LC_ALL=C sort | head -1)
              echo "=== [postgres] Reinit init-scripts from: $FIRST ==="

              # (Опционально) Загружаем переменные из .env в окружение runner'а, 
              # если они не передаются через secrets GitHub Actions напрямую.
              if [ -f .env ]; then
                set -a
                source .env
                set +a
              fi

              RUN=0
              for f in $(ls postgres/init/*.sql | LC_ALL=C sort); do
                [ "$f" = "$FIRST" ] && RUN=1
                [ "$RUN" = "1" ] || continue
                echo "--- running $f (with env substitution)"

                # envsubst подставит значения переменных перед отправкой в psql.
                # Указание конкретных переменных '${ADMIN_EMAIL} ${ADMIN_PASSWORD}' безопасно 
                # и предотвратит случайную замену других символов '$' в SQL.
                envsubst '${ADMIN_EMAIL} ${ADMIN_PASSWORD}' < "$f" | docker exec -i sm-postgres sh -c \
                  'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1'
              done
            fi

            # ---------- ALL BUILD (полный пересбор) ----------
            if [ "$ALL_BUILD" = "true" ]; then
              echo "=== [all_build] Full rebuild & restart ==="
              $COMPOSE up -d --build
              docker system prune --volumes --force
              exit 0
            fi

            # ---------- Точечные сборки frontend / backend ----------
            BUILD_SERVICES=""
            [ "$FRONTEND_BUILD" = "true" ] && BUILD_SERVICES="$BUILD_SERVICES sm-frontend"
            [ "$BACKEND_BUILD"  = "true" ] && BUILD_SERVICES="$BUILD_SERVICES sm-backend"

            if [ -n "$BUILD_SERVICES" ]; then
              echo "=== [build] $BUILD_SERVICES ==="
              $COMPOSE build $BUILD_SERVICES
              $COMPOSE up -d --no-deps $BUILD_SERVICES
            fi

            # ---------- Nginx: конфиг меняется на хосте, пересоздаём контейнер ----------
            if [ "$NGINX_BUILD" = "true" ]; then
              echo "=== [nginx] Reload rpi5.nginx.conf ==="
              $COMPOSE up -d --no-deps --force-recreate nginx
            fi

            # ---------- Postgres: только pg_hba.conf (перезапуск) ----------
            # Если сработал reinit — этот блок пропускаем (reinit всё равно пересоздаст)
            if [ "$POSTGRES_BUILD" = "true" ] && [ "$POSTGRES_REINIT" != "true" ]; then
              echo "=== [postgres] Reload pg_hba.conf ==="
              $COMPOSE up -d --no-deps --force-recreate sm-postgres
            fi

            docker system prune --volumes --force
            echo "=== DEPLOY DONE ==="
        env:
          FRONTEND_BUILD: ${{ needs.detect-changes.outputs.frontend_build }}
          BACKEND_BUILD: ${{ needs.detect-changes.outputs.backend_build }}
          NGINX_BUILD: ${{ needs.detect-changes.outputs.nginx_build }}
          POSTGRES_BUILD: ${{ needs.detect-changes.outputs.postgres_build }}
          POSTGRES_REINIT: ${{ needs.detect-changes.outputs.postgres_reinit }}
          ALL_BUILD: ${{ needs.detect-changes.outputs.all_build }}
          PREV_SHA: ${{ needs.detect-changes.outputs.prev_sha }}

  smoke-test:
    needs: build_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # для git push
    if: |
      always() &&
      needs.build_deploy.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check backend + dependencies health (via nginx)
        run: |
          BASE="https://stud-match.mooo.com/backend/api/v1/healths"
          MAX_ATTEMPTS=15      # ~2.5 минуты с паузой 10с
          DELAY=10
          failed=0

          for ep in backend postgres redis rustfs; do
            ep_ok=0
            code="000"
            body=""
            success="false"

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              # Один запрос — сразу и тело, и http-код
              resp=$(curl -s -w $'\n%{http_code}' --max-time 15 -fk "$BASE/$ep" || printf '\n000')
              code=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')
              success=$(printf '%s' "$body" | jq -r '.success // false' 2>/dev/null || echo "false")

              echo "$ep attempt $attempt/$MAX_ATTEMPTS: status=$code, success=$success"

              if [ "$code" = "200" ] && [ "$success" = "true" ]; then
                ep_ok=1
                break
              fi
              sleep "$DELAY"
            done

            if [ "$ep_ok" -ne 1 ]; then
              err=$(printf '%s' "$body" | jq -r '.metrics.error // .error // .message // "no error details"' 2>/dev/null || echo "no error details")
              echo "::error::$ep health check failed after $MAX_ATTEMPTS attempts (status=$code, success=$success, error=$err)"
              echo "$ep last response: $body"
              failed=1
            fi
          done

          exit $failed

      - name: Check frontend availability (via nginx)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -fk \
            https://stud-match.mooo.com/ || echo "000")
          echo "Frontend status: $response"
          if [ "$response" -ne 200 ]; then
            echo "::error::Frontend health check failed with status $response"
            exit 1
          fi

      - name: Mark deploy as successful
        if: success() # ← выполнится только если всё выше ОК
        run: |
          git tag -f deployed/last-success ${{ github.sha }}
          git push --force origin deployed/last-success

  rollback:
    needs: [detect-changes, build_deploy, smoke-test]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.build_deploy.result == 'failure' || needs.smoke-test.result == 'failure')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rollback on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: PREV_SHA,FRONTEND_BUILD,BACKEND_BUILD,NGINX_BUILD,POSTGRES_BUILD,POSTGRES_REINIT,ALL_BUILD
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git fetch --tags --force
            TARGET=$(git rev-list -n1 deployed/last-success)
            echo "=== ROLLBACK to: $TARGET ==="
            git reset --hard "$TARGET"
            echo "=== Now at: $(git rev-parse --short HEAD) ==="

            COMPOSE="docker compose -f rpi5.docker-compose.yaml"

            # ---------- postgres_reinit — восстановление из бэкапа ----------
            if [ "$POSTGRES_REINIT" = "true" ]; then
              if [ -d ./postgres/data_old ]; then
                echo "=== [rollback:postgres] Restore from backup ==="
                $COMPOSE rm -sf sm-postgres || true
                sudo rm -rf ./postgres/data
                sudo mv ./postgres/data_old ./postgres/data
                $COMPOSE up -d sm-postgres
                echo "=== [rollback:postgres] Data restored from ./postgres/data_old ==="
              else
                echo "::warning::./postgres/data_old not found — reinit never ran or backup was already consumed, DB data left intact"
              fi
            fi

            # ---------- all_build — полный пересбор ----------
            if [ "$ALL_BUILD" = "true" ]; then
              echo "=== [rollback:all_build] ==="
              $COMPOSE up -d --build
              docker system prune --volumes --force
              exit 0
            fi

            # ---------- frontend / backend — пересборка образов ----------
            BUILD_SERVICES=""
            [ "$FRONTEND_BUILD" = "true" ] && BUILD_SERVICES="$BUILD_SERVICES sm-frontend"
            [ "$BACKEND_BUILD"  = "true" ] && BUILD_SERVICES="$BUILD_SERVICES sm-backend"

            if [ -n "$BUILD_SERVICES" ]; then
              echo "=== [rollback:build] $BUILD_SERVICES ==="
              $COMPOSE build $BUILD_SERVICES
              $COMPOSE up -d --no-deps $BUILD_SERVICES
            fi

            # ---------- nginx — пересоздать контейнер ----------
            if [ "$NGINX_BUILD" = "true" ]; then
              echo "=== [rollback:nginx] ==="
              $COMPOSE up -d --no-deps --force-recreate nginx
            fi

            # ---------- postgres — перезапуск (pg_hba.conf) ----------
            if [ "$POSTGRES_BUILD" = "true" ] && [ "$POSTGRES_REINIT" != "true" ]; then
              echo "=== [rollback:postgres] ==="
              $COMPOSE up -d --no-deps --force-recreate sm-postgres
            fi

            docker system prune --volumes --force
            echo "=== ROLLBACK DONE ==="
        env:
          PREV_SHA: ${{ needs.build_deploy.outputs.prev_sha }}
          FRONTEND_BUILD: ${{ needs.detect-changes.outputs.frontend_build }}
          BACKEND_BUILD: ${{ needs.detect-changes.outputs.backend_build }}
          NGINX_BUILD: ${{ needs.detect-changes.outputs.nginx_build }}
          POSTGRES_BUILD: ${{ needs.detect-changes.outputs.postgres_build }}
          POSTGRES_REINIT: ${{ needs.detect-changes.outputs.postgres_reinit }}
          ALL_BUILD: ${{ needs.detect-changes.outputs.all_build }}
