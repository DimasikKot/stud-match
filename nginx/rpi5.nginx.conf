# ============================================
# EVENTS
# ============================================
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# ============================================
# HTTP-модуль (для веб-трафика)
# ============================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/http-access.log;
    error_log /var/log/nginx/http-error.log;

    # DNS для резолва имён контейнеров (Docker)
    # Один раз на весь http — наследуется везде
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Upstream-группы с динамическим резолвом
    # zone обязателен для работы resolve
    upstream sm-frontend {
        zone frontend_zone 1m;
        server sm-frontend:5100 resolve;
        keepalive 16;
    }

    upstream sm-backend {
        zone backend_zone 1m;
        server sm-backend:8060 resolve;
        keepalive 16;
    }

    # 1. HTTP сервер: Только для Let's Encrypt и редиректа на HTTPS
    server {
        listen 80;
        server_name stud-match.mooo.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Основной HTTPS сервер (маршрутизация по путям)
    server {
        listen 443 ssl;
        server_name stud-match.mooo.com localhost;

        # Пути к сертификатам
        # ssl_certificate /etc/nginx/ssl/server.crt;
        # ssl_certificate_key /etc/nginx/ssl/server.key;

        # Пути к сертификатам (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/stud-match.mooo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stud-match.mooo.com/privkey.pem;

        # Обрабатывает все запросы, которые не попали в другие location
        location / {
            proxy_pass http://sm-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для WebSocket (если Vite использует HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Запросы к /backend/ будут перенаправлены на бэкенд
        location /backend/ {
            proxy_pass http://sm-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            client_max_body_size 10M;
        }
    }
}