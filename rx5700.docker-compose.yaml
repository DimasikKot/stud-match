# rx5700 not working

services:
  sm-ml:
    container_name: ml
    build:
      context: ./ml
      dockerfile: ml.Dockerfile
    restart: always

    volumes:
      - ./ml:/app

    devices:
      - /dev/dxg:/dev/dxg
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "44" # render группа в WSL2 (может отличаться)
    privileged: true
    ipc: host
    deploy:
      resources:
        limits:
          memory: 4G
