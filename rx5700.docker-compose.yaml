# rx5700 not working

services:
  sm-llm-worker:
    container_name: sm-llm-worker
    build:
      context: ./llm-worker
      dockerfile: llm-worker.Dockerfile
    restart: always

    volumes:
      - ./llm-worker:/app

    devices:
      - /dev/dxg:/dev/dxg
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "44" # render группа в WSL2 (может отличаться)
    privileged: true
    ipc: host
    deploy:
      resources:
        limits:
          memory: 4G
