# win11

services:
  sm-frontend:
    container_name: sm-frontend
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5100/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./frontend:/app
      - sm_node_modules:/app/node_modules

    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - CHOKIDAR_USEPOLLING=true # Нужен для hot-reload

    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-backend:
    container_name: sm-backend
    build:
      context: ./backend # Папка, содержащая файлы контейнера
      dockerfile: backend.Dockerfile
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8060/backend/api/v1/healths/backend'', timeout=5)" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./backend:/app

    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${R_PASSWORD:?R_PASSWORD variable is not set}
      # DB
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD variable is not set}
      # JWT
      - USER_JWT_ACCESS_TOKEN_SECRET=${USER_JWT_ACCESS_TOKEN_SECRET:?USER_JWT_ACCESS_TOKEN_SECRET is not set}
      - USER_JWT_ACCESS_TOKEN_EXPIRATION_HOURS=${USER_JWT_ACCESS_TOKEN_EXPIRATION_HOURS}
      - USER_JWT_REFRESH_TOKEN_SECRET=${USER_JWT_REFRESH_TOKEN_SECRET:?USER_JWT_REFRESH_TOKEN_SECRET is not set}
      - USER_JWT_REFRESH_TOKEN_EXPIRATION_HOURS=${USER_JWT_REFRESH_TOKEN_EXPIRATION_HOURS}
      # Cookie
      - COOKIE_HTTPONLY=${COOKIE_HTTPONLY}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      #RustFS
      - RUSTFS_URL=${RUSTFS_URL}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET}
      - RUSTFS_ACCESS_KEY=${RFS_ACCESS_KEY:?RFS_ACCESS_KEY variable is not set}
      - RUSTFS_SECRET_KEY=${RFS_SECRET_KEY:?RFS_SECRET_KEY variable is not set}
      - RUSTFS_REGION=${RUSTFS_REGION}
      # LLM
      - TRAIN_JWT_ACCESS_TOKENS=${TRAIN_JWT_ACCESS_TOKENS}

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  sm-postgres:
    container_name: sm-postgres
    image: postgres:18 # фиксированная версия для стабильности
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm-admin -d sm-db"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./postgres/data:/var/lib/postgresql # Сохраняем данные
      - ./postgres/init:/docker-entrypoint-initdb.d # Папка со скриптами инициализации
      - ./postgres/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./postgres/ssl/server.key:/var/lib/postgresql/server.key:ro
      - ./postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro # Настройки доступа

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD variable is not set}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@stud-match.ru}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    command: >
      sh -c "
      cp /var/lib/postgresql/server.crt /tmp/server.crt &&
      cp /var/lib/postgresql/server.key /tmp/server.key &&
      cp /var/lib/postgresql/pg_hba.conf /tmp/pg_hba.conf &&
      chown 999:999 /tmp/server.crt /tmp/server.key /tmp/pg_hba.conf &&
      chmod 600 /tmp/server.key &&
      chmod 644 /tmp/pg_hba.conf &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/tmp/server.crt
      -c ssl_key_file=/tmp/server.key
      -c hba_file=/tmp/pg_hba.conf
      "

    ports:
      - "4500:5432"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  sm-redis:
    container_name: sm-redis
    image: redis:8
    restart: always

    volumes:
      - ./redis/data:/var/lib/redis/data
      - ./redis/ssl:/etc/redis/ssl:ro

    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}
    command:
      - /bin/sh
      - -c
      - >
        redis-server 
        --port 6350 
        --tls-port 6150 
        --tls-cert-file /etc/redis/ssl/server.crt 
        --tls-key-file /etc/redis/ssl/server.key 
        --tls-ca-cert-file /etc/redis/ssl/server.crt 
        --tls-auth-clients no 
        --tls-protocols "TLSv1.2 TLSv1.3" 
        --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"

    ports:
      - "6150:6150"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:443/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/localhost.nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "80:80"
      - "443:443"
      - "9050:9050"
      - "9150:9150"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nginx-network

  sm-rustfs:
    image: rustfs/rustfs:1.0.4-glibc
    container_name: sm-rustfs
    security_opt:
      - "no-new-privileges:true"

    environment:
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS}
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY variable is not set}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY variable is not set}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_VOLUMES=/data
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
      # - RUSTFS_TLS_PATH=/opt/tls
      # - при включенном TLS проверки работоспособности (healthchecks) автоматически переключаются на HTTPS
      # По умолчанию сохраняется строгая проверка топологии диска.
      # Только для локального тестирования можно явно задать
      # - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-false}
    volumes:
      - sm_rustfs_data:/data
      - sm_rustfs_logs:/app/logs
      # - ./rustfs/ssl:/opt/tls
    restart: unless-stopped
    healthcheck:
      # Поведение по умолчанию:
      # - HTTP, если переменная RUSTFS_TLS_PATH не задана
      # - HTTPS, если переменная RUSTFS_TLS_PATH задана
      # - для TLS через loopback используется флаг `-k` (игнорирование проверки сертификата), если не указаны точные значения хоста и CA
      #
      # Пример настройки строгого TLS:
      # - задайте RUSTFS_HEALTHCHECK_HOST (имя хоста, включенное в SAN сертификата)
      # - при необходимости задайте RUSTFS_HEALTHCHECK_CA (по умолчанию используется /opt/tls/ca.crt, если этот файл существует)
      test: [
          "CMD",
          "sh",
          "-ec",
          "host=\"$${RUSTFS_HEALTHCHECK_HOST:-127.0.0.1}\"; scheme=\"http\"; set -- -fsS; \
          if [ -n \"$${RUSTFS_TLS_PATH:-}\" ]; then \
          scheme=\"https\"; \
          ca_path=\"$${RUSTFS_HEALTHCHECK_CA:-}\"; \
          if [ -z \"$${ca_path}\" ] && [ -f /opt/tls/ca.crt ]; then ca_path=/opt/tls/ca.crt; fi; \
          case \"$${host}\" in 127.0.0.1|localhost) strict_host=false ;; *) strict_host=true ;; esac; \
          if [ \"$${strict_host}\" = true ] && [ -n \"$${ca_path}\" ]; then \
          set -- \"$${@}\" --cacert \"$${ca_path}\" --resolve \"$${host}:9250:127.0.0.1\" --resolve \"$${host}:9350:127.0.0.1\"; \
          else \
          set -- \"$${@}\" -k; \
          fi; \
          fi; \
          curl \"$${@}\" \"$${scheme}://$${host}:9250/health\" && \
          curl \"$${@}\" \"$${scheme}://$${host}:9350/rustfs/console/health\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true # Указываем что не локальная в docker-compose, а общая для всего докера

volumes:
  sm_node_modules:
  sm_rustfs_data:
  sm_rustfs_logs:
